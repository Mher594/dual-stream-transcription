<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Krisp — microphone access</title>
  <style>
    body {
      margin: 0;
      padding: 48px;
      display: flex;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 480px; display: flex; flex-direction: column; gap: 12px; }
    h1 { margin: 0; font: 600 18px/1.3 "Segoe UI", system-ui; }
    #msg { margin: 0; font: 400 14px/1.5 "Segoe UI", system-ui; color: #444; text-wrap: pretty; }
    #msg.error { font-weight: 700; color: #b00020; }
    #note {
      margin-top: 4px;
      padding: 12px 14px;
      background: #f8f9fa;
      border: 1px solid #e8eaed;
      border-radius: 4px;
      font: 400 12px/1.5 "Segoe UI", system-ui;
      color: #6b6b6b;
      text-wrap: pretty;
    }
  </style>
</head>
<body>
  <main>
    <h1>Allow microphone access</h1>
    <p id="msg">
      Chrome is asking for microphone permission — choose <b>Allow</b>.
      This tab closes by itself once access is granted.
    </p>
    <div id="note">
      Asked once per extension, from a real tab — the invisible capture document has no
      window Chrome can prompt in.
    </div>
  </main>
  <script type="module" src="permission.js"></script>
</body>
</html>
